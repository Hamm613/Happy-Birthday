<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hamza · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
<section id="login" class="wrap center">
  <h1 class="script">Hamza’s inbox</h1>
  <form id="loginForm" class="panel">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn">Sign in</button>
    <p class="note" id="err"></p>
  </form>
</section>

<aside id="chat" class="open" hidden>
  <header>
    <div class="av">K</div>
    <div><strong>Khansa</strong><small><i id="dot"></i><span id="status">Offline</span></small></div>
    <button id="notif" class="btn ghost small-btn">Enable alerts</button>
  </header>
  <div id="msgs"></div>
  <form id="send"><input id="txt" placeholder="Reply to Khansa…" autocomplete="off" maxlength="800"><button class="btn" aria-label="Send">➤</button></form>
</aside>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
